plugins {
    id "com.android.application"
    id "kotlin-android"
}

android {
    namespace "com.example.sosauto" // Asegúrate de que coincida con tu paquete
    compileSdk 34 // Versión moderna de compilación

    defaultConfig {
        applicationId "com.example.sosauto"
        minSdk 21
        targetSdk 34 // <-- Clave para evitar el bloqueo de versiones anteriores en Android
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Agrega aquí tu configuración de firmas si es necesario
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Tus dependencias adicionales del proyecto van aquí
}
