android {
    namespace "com.sosauto.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.sosauto.app"
        minSdkVersion 23 // Garantiza compatibilidad desde Android 6.0 en adelante
        targetSdkVersion 34 // Resuelve el aviso de versión anterior de Android
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
