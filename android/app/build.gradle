android {
    namespace "com.sosauto.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.sosauto.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // Resto de configuraciones de buildTypes y signingConfigs...
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
