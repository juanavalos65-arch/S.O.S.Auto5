pluginManagement {
    def flutterSdkPath = ((FindProperty('flutter.sdk'))?.toString())
    if (flutterSdkPath == null) {
        Properties properties = new Properties()
        properties.load(new File("local.properties").newDataInputStream())
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

include ":app"
