pluginManagement {
    def flutterSdkPath = ((FindProperty('flutter.sdk'))?.toString())
    if (flutterSdkPath == null) {
        Properties properties = new Properties()
        File flutterSettingsFile = new File("local.properties")
        if (flutterSettingsFile.exists()) {
            properties.load(flutterSettingsFile.newDataInputStream())
            flutterSdkPath = properties.getProperty("flutter.sdk")
        }
    }
    if (flutterSdkPath == null) {
        flutterSdkPath = System.getenv("FLUTTER_ROOT")
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

include ":app"
project(":app").projectDir = new File('android/app')
