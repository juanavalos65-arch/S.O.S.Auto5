workflows:
  sos-auto-android-workflow:
    name: S.O.S. Auto Android Workflow
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      groups:
        - keystore_credentials
    scripts:
      - name: Build Android Release APK
        script: |
          # Limpiar dependencias y compilar el proyecto en modo release apuntando a la carpeta android
          cd android && ./gradlew assembleRelease
    artifacts:
      - 'android/app/build/outputs/apk/release/*.apk'
