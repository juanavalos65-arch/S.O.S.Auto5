name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate clean project structure and update Kotlin
        run: |
          # 1. Respaldar código y configuración de la app S.O.S. Auto
          mkdir -p backup_files
          cp -r lib backup_files/
          cp pubspec.yaml backup_files/
          if [ -d "assets" ]; then cp -r assets backup_files/; fi

          # 2. Asegurar nombre de paquete válido
          sed -i 's/^name:.*/name: sos_auto/' pubspec.yaml

          # 3. Regenerar estructura limpia de Flutter
          flutter create . --org ge.sosauto --project-name sos_auto --platforms=android

          # 4. Restaurar código y dependencias
          rm -rf lib
          cp -r backup_files/lib .
          cp -r backup_files/pubspec.yaml .
          if [ -d "backup_files/assets" ]; then cp -r backup_files/assets .; fi

          # 5. Actualizar de forma segura la versión de Kotlin en el build.gradle generado por Flutter
          python3 -c "
          import re
          path = 'android/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          if 'ext.kotlin_version' in content:
              content = re.sub(r\"ext\.kotlin_version\s*=\s*['\"].*?['\"]\", \"ext.kotlin_version = '1.9.22'\", content)
          else:
              content = content.replace('buildscript {', \"buildscript {\n    ext.kotlin_version = '1.9.22'\")

          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release
