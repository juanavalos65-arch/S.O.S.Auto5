name: Build APK, AAB and Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate clean project structure and configure Kotlin in settings.gradle
        run: |
          # 1. Respaldar código y configuración de S.O.S. Auto
          mkdir -p backup_files
          cp -r lib backup_files/
          cp pubspec.yaml backup_files/
          if [ -d "assets" ]; then cp -r assets backup_files/; fi

          # 2. Asegurar nombre de paquete válido
          sed -i 's/^name:.*/name: sos_auto/' pubspec.yaml

          # 3. Regenerar estructura limpia de Flutter con soporte web y android
          flutter create . --org ge.sosauto --project-name sos_auto --platforms=android,web

          # 4. Restaurar código y dependencias
          rm -rf lib
          cp -r backup_files/lib .
          cp backup_files/pubspec.yaml .
          if [ -d "backup_files/assets" ]; then cp -r backup_files/assets .; fi

          # 5. Actualizar la versión del plugin de Kotlin a 1.9.22 en android/settings.gradle
          if grep -q "org.jetbrains.kotlin.android" android/settings.gradle; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          else
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '1.9.22'/" android/settings.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK, App Bundle and Web
        run: |
          flutter build apk --release
          flutter build appbundle --release
          flutter build web --release

      - name: Upload Artifacts (APK, AAB & Web)
        uses: actions/upload-artifact@v4
        with:
          name: sos-auto-release-bundle
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/web/
