name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate clean project structure and apply fixed Gradle
        run: |
          # 1. Respaldar código y configuración de S.O.S. Auto
          mkdir -p backup_files
          cp -r lib backup_files/
          cp pubspec.yaml backup_files/
          if [ -d "assets" ]; then cp -r assets backup_files/; fi
          if [ -f "android/build.gradle" ]; then cp android/build.gradle backup_files/build.gradle.custom; fi

          # 2. Asegurar nombre de paquete válido
          sed -i 's/^name:.*/name: sos_auto/' pubspec.yaml

          # 3. Regenerar estructura limpia de Flutter
          flutter create . --org ge.sosauto --project-name sos_auto --platforms=android

          # 4. Restaurar código y dependencias
          rm -rf lib
          cp -r backup_files/lib .
          cp backup_files/pubspec.yaml .
          if [ -d "backup_files/assets" ]; then cp -r backup_files/assets .; fi

          # 5. Sobrescribir directamente el build.gradle con nuestra versión garantizada de Kotlin 1.9.22
          cat << 'EOF' > android/build.gradle
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release
