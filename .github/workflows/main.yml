name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate clean project structure and update Kotlin
        run: |
          # 1. Respaldar código y configuración de S.O.S. Auto
          mkdir -p backup_files
          cp -r lib backup_files/
          cp pubspec.yaml backup_files/
          if [ -d "assets" ]; then cp -r assets backup_files/; fi

          # 2. Asegurar nombre de paquete válido
          sed -i 's/^name:.*/name: sos_auto/' pubspec.yaml

          # 3. Regenerar estructura limpia de Flutter
          flutter create . --org ge.sosauto --project-name sos_auto --platforms=android

          # 4. Restaurar código y dependencias
          rm -rf lib
          cp -r backup_files/lib .
          cp backup_files/pubspec.yaml .
          if [ -d "backup_files/assets" ]; then cp -r backup_files/assets .; fi

          # 5. Inyectar o actualizar la versión de Kotlin a 1.9.22 en android/build.gradle usando sed
          if grep -q "ext.kotlin_version" android/build.gradle; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle
          else
            sed -i "/buildscript {/a \    ext.kotlin_version = '1.9.22'" android/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release
