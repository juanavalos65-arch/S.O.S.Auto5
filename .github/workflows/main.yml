name: Build S.O.S. Auto APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean old Android files and regenerate clean platform
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=sos_auto5

      - name: Fix Kotlin Version in Gradle
        run: |
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/g" android/build.gradle
          fi

      - name: Build APK, App Bundle and Web
        run: flutter build apk --release

      - name: Upload Artifacts (APK)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
