name: Build S.O.S. Auto Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean old Android files and regenerate clean platform
        run: |
          rm -rf android
          flutter create . --platforms=android,web --project-name=sos_auto

      - name: Fix Kotlin Version in settings.gradle
        run: |
          sed -i 's/version "1.7.10"/version "1.9.20"/g' android/settings.gradle || true
          sed -i 's/version "1.7.0"/version "1.9.20"/g' android/settings.gradle || true
          sed -i 's/version "1.8.0"/version "1.9.20"/g' android/settings.gradle || true
          sed -i 's/version "1.8.22"/version "1.9.20"/g' android/settings.gradle || true

      - name: Build APK, App Bundle and Web
        run: |
          flutter build apk --release
          flutter build appbundle --release
          flutter build web --release

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sos-auto-release-bundles
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/web/
