name: Build S.O.S. Auto Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Ensure Android project files without overwriting Firebase config
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/google-services.json /tmp/google-services.json 2>/dev/null || true
            cp android/app/build.gradle /tmp/app-build.gradle 2>/dev/null || true
            cp android/settings.gradle /tmp/settings.gradle 2>/dev/null || true
            flutter create . --org ge.sosauto --project-name app --platforms android
            cp /tmp/google-services.json android/app/google-services.json 2>/dev/null || true
            cp /tmp/app-build.gradle android/app/build.gradle 2>/dev/null || true
            cp /tmp/settings.gradle android/settings.gradle 2>/dev/null || true
          fi

      - name: Configurar minSdkVersion 23 para Firebase
        run: |
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion 21/minSdkVersion 23/g' {} +

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sos-auto-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
