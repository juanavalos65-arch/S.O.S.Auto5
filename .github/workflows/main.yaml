name: Build S.O.S. Auto Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Regenerar estructura Android v2 limpia
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sosauto .

      - name: Configurar permisos en AndroidManifest (v2)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' "$MANIFEST"
          sed -i 's|android:label="[^"]*"|android:label="S.O.S. Auto"|' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static code analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sos-auto-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
