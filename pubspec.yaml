name: sos_auto5
description: "S.O.S. Auto - Asistencia vial, emergencias y red de seguridad vehicular."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend, Base de Datos y Notificaciones Push
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.0.2
  supabase_flutter: ^2.5.6

  # Mapa Interactivo OpenStreetMap y Geolocalización
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Almacenamiento Cifrado y Biometría
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # Audio de Sirena, Voz, Utilidades y Pasarela Wompi
  audioplayers: ^6.1.0
  flutter_tts: 3.8.5
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/widget/IMG-20261118-WA5334.png"
  adaptive_icon_background: "#0B192C"
  adaptive_icon_foreground: "lib/widget/IMG-20261118-WA5334.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - lib/widget/IMG-20261118-WA5334.png
