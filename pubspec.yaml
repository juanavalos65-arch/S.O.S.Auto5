name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate clean project structure
        run: |
          mkdir -p backup_files
          cp -r lib backup_files/
          cp pubspec.yaml backup_files/
          if [ -d "assets" ]; then cp -r assets backup_files/; fi

          sed -i 's/^name:.*/name: sos_auto/' pubspec.yaml

          flutter create . --org ge.sosauto --project-name sos_auto --platforms=android

          rm -rf lib
          cp -r backup_files/lib .
          cp backup_files/pubspec.yaml .
          if [ -d "backup_files/assets" ]; then cp -r backup_files/assets .; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release
