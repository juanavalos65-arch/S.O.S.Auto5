name: sos_auto5
description: "Aplicación móvil de asistencia vial, seguridad y navegación comunitaria S.O.S. Auto."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Mapas y Geolocalización (Incluyendo flutter_map y latlong2)
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0

  # Base de datos y Backend
  supabase_flutter: ^2.0.0

  # Seguridad, Biometría y Cifrado
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Conectividad, API y Pasarela Wompi
  http: ^1.1.0
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2

  # Interfaz e Iconos
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Recursos gráficos y logotipo oficial de S.O.S. Auto
  assets:
    - assets/icon/icon_sos.png
