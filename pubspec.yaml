name: sos_auto5
description: "S.O.S. Auto - Sistema de asistencia y tránsito activo"
publish_to: 'none' # Evita la publicación accidental en pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Iconos oficiales y elementos visuales
  cupertino_icons: ^1.0.6

  # Puedes descomentar las siguientes dependencias si tus nuevos archivos las requieren:
  # http: ^1.2.0                # Para peticiones de red / API
  # shared_preferences: ^2.2.2   # Para almacenamiento local (PIN, sesión, placa)
  # geolocator: ^10.1.0          # Para ubicación GPS en tiempo real y alertas
  # google_maps_flutter: ^2.5.3  # Para el mapa interactivo principal

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Si agregas el logotipo oficial u otros recursos gráficos (imágenes/iconos), decláralos aquí:
  # assets:
  #   - assets/images/
