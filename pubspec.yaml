workflows:
  android-workflow:
    name: Build S.O.S. Auto (Android APK & Bundle)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play_credentials # Grupo de variables de entorno configurado en Codemagic
      vars:
        PACKAGE_NAME: "ge.sosauto.app"
        NOTIFICATION_EMAIL: "soporte.applay65@gmail.com"
    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter packages pub get

      - name: Verificar análisis estático y formateo
        script: |
          flutter analyze
          
      - name: Ejecutar pruebas unitarias
        script: |
          flutter test

      - name: Construir APK de prueba (Release)
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUMBER

      - name: Construir Android App Bundle (AAB) para Google Play
        script: |
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - soporte.applay65@gmail.com
        notify:
          success: true
          failure: true
