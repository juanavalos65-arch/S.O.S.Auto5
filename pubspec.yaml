name: app
description: "S.O.S. Auto - Asistencia vial, emergencias y red de seguridad vehicular."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend, Base de Datos y Notificaciones Push
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  supabase_flutter: ^2.5.6

  # Mapa Interactivo y Geolocalización
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Seguridad (PIN / Biometría) y Almacenamiento Cifrado
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # Utilidades y Pasarela Wompi
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
