name: sos_auto5
description: "S.O.S. Auto - Red de asistencia vial y seguridad vehicular."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "lib/widget/IMG-20261118-WA5334.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D32F2F"
  adaptive_icon_foreground: "lib/widget/IMG-20261118-WA5334.png"
  web:
    generate: true
    image_path: "lib/widget/IMG-20261118-WA5334.png"
    background_color: "#D32F2F"
    theme_color: "#D32F2F"

flutter:
  uses-material-design: true
  assets:
    - lib/widget/
